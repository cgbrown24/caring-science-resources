<script>

const circle =
  document.getElementById("breathCircle");

const breathText =
  document.getElementById("breathText");

const instruction =
  document.getElementById("instruction");

const timerText =
  document.getElementById("timerText");

const startBtn =
  document.getElementById("startBtn");

const resetBtn =
  document.getElementById("resetBtn");

const completionMessage =
  document.getElementById("completionMessage");

const breathStage =
  document.querySelector(".breath-stage");

let isRunning = false;

let currentTimeout;

let completionTimeout;

function inhale() {

  if (!isRunning) return;

  circle.classList.remove("exhale");

  circle.classList.add("inhale");

  breathText.textContent =
    "Inhale";

  instruction.textContent =
    "Breathe in calm, compassion, and presence.";

  timerText.textContent =
    "Inhale for 4 seconds";

  currentTimeout =
    setTimeout(exhale, 4000);
}

function exhale() {

  if (!isRunning) return;

  circle.classList.remove("inhale");

  circle.classList.add("exhale");

  breathText.textContent =
    "Exhale";

  instruction.textContent =
    "Release tension and return to centered awareness.";

  timerText.textContent =
    "Exhale for 6 seconds";

  currentTimeout =
    setTimeout(inhale, 6000);
}

startBtn.onclick = function () {

  if (isRunning) return;

  isRunning = true;

  startBtn.textContent =
    "Breathing...";

  completionMessage.classList.remove("show");

  breathStage.classList.add("active");

  inhale();

  completionTimeout =
    setTimeout(function () {

      completionMessage.classList.add("show");

    }, 60000);
};

resetBtn.onclick = function () {

  isRunning = false;

  clearTimeout(currentTimeout);

  clearTimeout(completionTimeout);

  circle.classList.remove(
    "inhale",
    "exhale"
  );

  breathStage.classList.remove("active");

  completionMessage.classList.remove("show");

  breathText.textContent =
    "Breathe";

  instruction.textContent =
    "Take a mindful moment to ground yourself before continuing.";

  timerText.textContent =
    "4 second inhale · 6 second exhale";

  startBtn.textContent =
    "Begin";
};

</script>
